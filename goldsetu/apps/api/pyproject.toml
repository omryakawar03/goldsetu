[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "goldsetu-api"
version = "0.1.0"
description = "GOLDSETU API and domain foundation"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "email-validator>=2.2,<3",
  "python-dotenv>=1.0,<2",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "pymongo>=4.13,<5",
  "uvicorn[standard]>=0.34,<1",
]

[project.scripts]
goldsetu-migrate = "app.db.migrate_cli:cli"

[project.optional-dependencies]
test = ["pytest>=8.3,<9", "pytest-asyncio>=0.25,<2", "httpx>=0.28,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["app/tests", "tests"]

[tool.setuptools.packages.find]
include = ["app*"]




